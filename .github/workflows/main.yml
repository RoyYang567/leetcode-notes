name: 更新题解数量

on:
  push:
    paths:
      - '**.py'
  workflow_dispatch:

jobs:
  test-count:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 只统计数量，不修改文件
        run: |
          COUNT=$(find solutions -name "*.py" -type f 2>/dev/null | wc -l | xargs)
          echo "找到的题解数量：$COUNT"
          if [ -z "$COUNT" ]; then COUNT=0; fi
          echo "COUNT=$COUNT" >> $GITHUB_ENV   # 输出环境变量方便查看
