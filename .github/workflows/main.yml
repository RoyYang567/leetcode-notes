- name: 统计文件数量并更新 README
  run: |
    # 只统计 solutions 目录下的 .py 文件（排除子目录中的非题解文件，如果有）
    COUNT=$(find ./solutions -name "*.py" -type f 2>/dev/null | wc -l | xargs)
    # 如果 solutions 目录不存在，回退到统计所有 .py（排除常见缓存）
    if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
      COUNT=$(find . -path ./venv -prune -o -path ./__pycache__ -prune -o -name "*.py" -type f -print | wc -l | xargs)
    fi
    
    # 不管占位符后有没有数字，直接替换整行
    sed -i "s/^\(.*<!-- SOL_COUNT -->\).*/\1 $COUNT/" README.md
    
    cat README.md
