- name: 统计文件数量并更新 README
  run: |
    # 只统计 solutions 目录下的 .py，避免干扰
    COUNT=$(find ./solutions -name "*.py" -type f 2>/dev/null | wc -l | xargs)
    # 如果找不到 solutions 目录，则回退到全仓库排除常见缓存目录
    if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
      COUNT=$(find . -path ./venv -prune -o -path ./__pycache__ -prune -o -name "*.py" -type f -print | wc -l | xargs)
    fi
    # 用更强的替换：匹配整个占位符行，替换成新的数字
    sed -i "s/<!-- SOL_COUNT --> [0-9]*/<!-- SOL_COUNT --> $COUNT/" README.md
    # 如果上面没匹配到数字，则直接替换占位符
    sed -i "s/<!-- SOL_COUNT -->/<!-- SOL_COUNT --> $COUNT/" README.md
    cat README.md
